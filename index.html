<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: 0; }
    #status[data-kind="manual"] { padding: .5rem .75rem; border-left: 4px solid #b45309; background: #fef3c7; color: #451a03; }
    #status[data-kind="invalid"] { color: #b91c1c; }
    h2 { font-size: 1rem; margin: 1rem 0 .25rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <h2>Тема</h2>
    <p id="topic"></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { applyView, pendingView, viewFor } from "/triage-view.mjs";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const els = {
      status: document.querySelector("#status"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
      panel: document.querySelector("#result"),
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // Сразу убираем предыдущий результат, чтобы старый черновик не остался рядом с новой заявкой.
      applyView(els, pendingView());
      if (message.value.trim() === "") {
        applyView(els, viewFor(400, { status: "invalid_input" }));
        return;
      }
      button.disabled = true;
      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: AbortSignal.timeout(5000),
        });
        const body = await reply.json().catch(() => null);
        view = viewFor(reply.status, body);
      } catch {
        view = viewFor(0, null); // сеть недоступна или сервер завис
      } finally {
        button.disabled = false;
      }
      applyView(els, view);
    });
  </script>
</body>
</html>
